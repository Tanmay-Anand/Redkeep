# Full pass — thorough. Use for a complete engagement against the lab target.
network:
  nmap_args: ["-sV", "-sC", "-p-", "-T4"]
  host_timeout: "15m"   # nmap skips a host after this, so one slow host can't stall the pass
  timeout: 3600         # seconds per tool run; a timeout is logged and the scan carries on
  metasploit: true      # auxiliary/scanner modules only
web:
  zap:
    mode: full          # spider + passive + active scan
  nuclei: true
  nikto: true
api:
  schemathesis: true
  zap_api: true
