[project]
name = "redkeep-vapt"
version = "0.1.0"
description = "Redkeep VAPT runner — drives network/web/API passes and ingests findings into DefectDojo"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6",
    "jinja2>=3.1",
    "rich>=13",
    "schemathesis>=3.33,<4",
]

[project.scripts]
vapt = "vapt.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["vapt*"]
