# Scheduled build of the Kali toolbox image + a tool-presence smoke test.
#
# This is the CI that would have caught the drift found during the first real
# run: the nuclei download 404, zap.sh missing from PATH, and the empty nuclei
# template dir. It is heavy (pulls kali-rolling + metasploit + ZAP, ~6 GB), so
# it runs weekly on a schedule and on demand — NOT on every push. It never runs
# a scan or starts a target.
name: image-smoke

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-probe:
    name: build toolbox + probe tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Kali toolbox
        uses: docker/build-push-action@v6
        with:
          context: lab/kali
          load: true
          tags: redkeep/kali-toolbox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tool-presence smoke test
        run: |
          docker run --rm --entrypoint sh redkeep/kali-toolbox:ci -c '
            set -e
            for t in nmap msfconsole zap.sh nuclei schemathesis node java python3 newman nikto vapt; do
              if command -v "$t" >/dev/null 2>&1; then
                echo "ok: $t"
              else
                echo "MISSING: $t"; exit 1
              fi
            done
            if [ -z "$(ls -A /root/nuclei-templates 2>/dev/null)" ]; then
              echo "FAIL: nuclei template directory is empty"; exit 1
            fi
            echo "all tools present; nuclei templates populated"
          '
